<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livro Zero: Capítulo 1 — O Rio | Leitor Imersivo Multilíngue</title>
  
  <!-- SEO & Social Meta -->
  <meta name="description" content="Leia o Capítulo 1 — O Rio do Livro Zero em um leitor literário imersivo multilíngue com áudio atmosférico procedural e modos visuais de leitura.">
  <meta property="og:title" content="Livro Zero: Capítulo 1 — O Rio | Experiência Literária Imersiva">
  <meta property="og:image" content="assets/concept/09-scandinavian-river-frontier.jpg">

  <!-- Google Fonts: Cinzel, Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       IMMERSIVE READER — SANCTUARY OF LIVING LITERATURE
       ========================================================================== */
    :root {
      --gold: #d4af37;
      --gold-light: #f7eed9;
      --gold-dim: rgba(212, 175, 55, 0.4);
      --crimson: #8c251d;
      
      /* Theme: Fogueira (Default) */
      --bg-ambient: #07090c;
      --tome-leather: #16110b;
      --tome-border: #2c2015;
      --paper-bg: linear-gradient(135deg, #f8f2e4 0%, #efe5cd 50%, #e2d3b1 100%);
      --paper-text: #2c2217;
      --paper-heading: #171109;
      --paper-quote-border: #8c251d;
      --paper-shadow: rgba(0, 0, 0, 0.55);
      --font-reading-size: 1.08rem;
    }

    /* Pergaminho Real Theme */
    body.theme-pergaminho {
      --bg-ambient: #111418;
      --tome-leather: #201812;
      --tome-border: #3d2f23;
      --paper-bg: linear-gradient(135deg, #fffdf8 0%, #f7f1e1 50%, #eee4ca 100%);
      --paper-text: #241c14;
      --paper-heading: #1a120b;
      --paper-quote-border: #9b7238;
      --paper-shadow: rgba(0, 0, 0, 0.45);
    }

    /* Noite Sem Estrelas (Dark OLED Mode) */
    body.theme-noite {
      --bg-ambient: #020305;
      --tome-leather: #0b0e13;
      --tome-border: #18202b;
      --paper-bg: linear-gradient(135deg, #10151d 0%, #0d1219 50%, #090c10 100%);
      --paper-text: #d8dee9;
      --paper-heading: #f3f4f6;
      --paper-quote-border: #d4af37;
      --paper-shadow: rgba(0, 0, 0, 0.85);
    }

    /* Luz da Manhã (Editorial Clean) */
    body.theme-luz {
      --bg-ambient: #e5e7eb;
      --tome-leather: #374151;
      --tome-border: #4b5563;
      --paper-bg: #fafaf9;
      --paper-text: #1f2937;
      --paper-heading: #111827;
      --paper-quote-border: #b91c1c;
      --paper-shadow: rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-ambient);
      color: #f3f4f6;
      transition: background-color 0.4s ease;
    }

    /* Ambient Backdrop with Atmospheric Mist */
    .ambient-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 20%, rgba(20, 28, 38, 0.6) 0%, rgba(5, 7, 10, 0.95) 100%),
                  url('assets/concept/09-scandinavian-river-frontier.jpg') center/cover no-repeat;
      filter: brightness(0.28) contrast(1.15) saturate(0.85);
      z-index: 0;
      pointer-events: none;
      transition: filter 0.5s ease;
    }

    body.theme-noite .ambient-backdrop {
      filter: brightness(0.12) contrast(1.2);
    }

    body.theme-luz .ambient-backdrop {
      display: none;
    }

    /* Subtle Floating Ember / Fog Particles Container */
    .ambient-fog {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at 50% 80%, rgba(212, 175, 55, 0.03) 0%, transparent 60%);
    }

    /* App Container */
    .reader-app {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Control Bar */
    .reader-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: rgba(8, 11, 16, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      transition: transform 0.3s ease, opacity 0.3s ease;
      gap: 14px;
    }

    .zen-mode .reader-header {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .zen-mode .reader-footer {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .btn-back-portal {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 13px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.03);
      white-space: nowrap;
    }

    .btn-back-portal:hover {
      color: var(--gold);
      border-color: var(--gold);
      background: rgba(212, 175, 55, 0.1);
    }

    .book-meta-title {
      font-family: 'Cinzel', serif;
      font-size: 0.92rem;
      letter-spacing: 0.08em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .book-meta-badge {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--gold);
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold-dim);
      padding: 2px 7px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    /* Language Switcher Buttons */
    .book-lang-group {
      display: flex;
      gap: 3px;
      background: rgba(18, 24, 34, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 3px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .btn-book-lang {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.76rem;
      padding: 5px 9px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-book-lang.active {
      background: var(--gold);
      color: #0b0906;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.35);
    }

    .btn-book-lang:hover:not(.active) {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    /* Ambient Audio Controls */
    .audio-control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(18, 24, 34, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3px 10px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .audio-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 6px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .audio-btn:hover {
      color: var(--gold);
    }

    .audio-btn.playing {
      color: #10b981;
    }

    .audio-btn.playing .audio-icon {
      animation: pulseSound 1.5s infinite;
    }

    @keyframes pulseSound {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .audio-preset-select {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.76rem;
      outline: none;
      cursor: pointer;
    }

    .audio-preset-select option {
      background: #0f172a;
      color: #f1f5f9;
    }

    /* Theme Dropdown / Buttons */
    .theme-buttons-group {
      display: flex;
      gap: 4px;
      background: rgba(18, 24, 34, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .btn-theme {
      background: transparent;
      border: none;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #94a3b8;
      transition: all 0.2s ease;
    }

    .btn-theme.active, .btn-theme:hover {
      background: rgba(212, 175, 55, 0.2);
      color: #ffffff;
    }

    /* Font Size Controls */
    .font-size-group {
      display: flex;
      gap: 2px;
      background: rgba(18, 24, 34, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .btn-font-size {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all 0.2s;
    }

    .btn-font-size:hover {
      color: var(--gold);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Zen Mode Toggle */
    .btn-zen {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-zen:hover {
      color: var(--gold);
      border-color: var(--gold);
    }

    /* Main Stage */
    .reader-main-stage {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    /* Book Tome Stage Container */
    .book-sanctuary {
      position: relative;
      width: 100%;
      max-width: 920px;
      perspective: 1200px;
    }

    /* Real Ribbon Bookmark */
    .sanctuary-ribbon {
      position: absolute;
      top: -14px;
      right: 75px;
      width: 24px;
      height: 85px;
      background: linear-gradient(to right, #7f1d1d, #b91c1c, #991b1b);
      border-radius: 0 0 3px 3px;
      box-shadow: 2px 5px 15px rgba(0, 0, 0, 0.7);
      z-index: 20;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
      transition: transform 0.3s ease;
    }

    .sanctuary-ribbon:hover {
      transform: translateY(4px);
    }

    /* The Realistic Tome */
    .book-leather-tome {
      position: relative;
      background: var(--tome-leather);
      border: 12px solid var(--tome-border);
      border-radius: 14px;
      box-shadow: 0 30px 70px var(--paper-shadow), 0 0 0 1px rgba(212, 175, 55, 0.25);
      overflow: hidden;
      transition: all 0.4s ease;
    }

    /* Paper Spread Interior */
    .parchment-sheet {
      background: var(--paper-bg);
      color: var(--paper-text);
      padding: 55px 65px 45px 65px;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: inset 0 0 50px rgba(120, 95, 55, 0.16), inset 0 0 12px rgba(0, 0, 0, 0.2);
    }

    /* Spine Fold Effect */
    .parchment-sheet::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 32px;
      height: 100%;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.16), transparent);
      pointer-events: none;
    }

    /* Content Area */
    #pageContentMount {
      width: 100%;
      min-height: 440px;
    }

    /* Header Strip on each page */
    .page-head-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      font-weight: 700;
      color: #8c734b;
      border-bottom: 1px solid rgba(140, 115, 75, 0.28);
      padding-bottom: 8px;
      margin-bottom: 24px;
      font-family: 'Cinzel', serif;
    }

    body.theme-noite .page-head-strip {
      color: var(--gold);
      border-color: rgba(212, 175, 55, 0.25);
    }

    .story-page-title {
      font-family: 'Cinzel', serif;
      font-size: 1.85rem;
      color: var(--paper-heading);
      letter-spacing: 0.04em;
      margin-bottom: 22px;
      text-align: left;
    }

    /* Body Text Styling */
    .story-prose {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: var(--font-reading-size);
      line-height: 1.85;
      text-align: left;
    }

    .story-prose p {
      margin-bottom: 18px;
    }

    /* Drop Cap */
    .story-prose .drop-cap::first-letter {
      float: left;
      font-family: 'Cinzel', serif;
      font-size: 3.8rem;
      line-height: 0.8;
      padding-top: 4px;
      padding-right: 12px;
      padding-bottom: 2px;
      color: var(--crimson);
      font-weight: 700;
    }

    body.theme-noite .story-prose .drop-cap::first-letter {
      color: var(--gold);
    }

    /* Pull Quotes / Dialogue Quotes */
    .story-blockquote {
      margin: 24px 0;
      padding: 14px 22px;
      border-left: 3px solid var(--paper-quote-border);
      background: rgba(140, 115, 75, 0.08);
      font-style: italic;
      font-size: calc(var(--font-reading-size) * 1.05);
      color: var(--paper-heading);
      border-radius: 0 4px 4px 0;
    }

    .page-footer-index {
      text-align: center;
      font-size: 0.82rem;
      font-family: 'Cinzel', serif;
      color: #8c734b;
      margin-top: 30px;
      letter-spacing: 0.12em;
    }

    /* Cover Styling */
    .page-cover {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      min-height: 480px;
    }

    .cover-ornament {
      font-size: 1.1rem;
      color: #8c734b;
      letter-spacing: 0.4em;
      margin: 16px 0;
    }

    body.theme-noite .cover-ornament {
      color: var(--gold);
    }

    .cover-eyebrow {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.24em;
      font-weight: 700;
      color: #7a633f;
      margin-bottom: 14px;
    }

    body.theme-noite .cover-eyebrow {
      color: #a3895e;
    }

    .cover-main-title {
      font-family: 'Cinzel', serif;
      font-size: 3.2rem;
      color: var(--paper-heading);
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .cover-subtitle {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.5rem;
      color: var(--crimson);
      font-style: italic;
      margin-bottom: 22px;
    }

    body.theme-noite .cover-subtitle {
      color: var(--gold);
    }

    .cover-divider {
      width: 120px;
      height: 2px;
      background: linear-gradient(to right, transparent, #8c734b, transparent);
      margin-bottom: 26px;
    }

    .cover-quote {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.25rem;
      line-height: 1.7;
      color: var(--paper-text);
      max-width: 520px;
      margin-bottom: 35px;
    }

    .cover-footer {
      border-top: 1px solid rgba(140, 115, 75, 0.3);
      padding-top: 18px;
      width: 100%;
      max-width: 440px;
    }

    .cover-author {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--paper-heading);
      letter-spacing: 0.06em;
    }

    .cover-era {
      font-size: 0.78rem;
      color: #8c734b;
      margin-top: 4px;
      letter-spacing: 0.08em;
    }

    /* Navigation Arrows & Controls Bar */
    .tome-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 26px;
      background: #0b0906;
      border-top: 1px solid #231c15;
    }

    body.theme-noite .tome-controls {
      background: #06090e;
      border-color: #161e2a;
    }

    body.theme-luz .tome-controls {
      background: #e5e7eb;
      border-color: #d1d5db;
    }

    .btn-nav-page {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: var(--gold-light);
      font-size: 0.86rem;
      font-weight: 600;
      padding: 8px 18px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    body.theme-luz .btn-nav-page {
      color: #1f2937;
      border-color: #9ca3af;
    }

    .btn-nav-page:hover:not(:disabled) {
      background: rgba(212, 175, 55, 0.18);
      border-color: var(--gold);
      color: #ffffff;
    }

    .btn-nav-page:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .page-indicator-badge {
      font-family: 'Cinzel', serif;
      font-size: 0.92rem;
      color: var(--gold);
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    /* Chapter Quick Drawer / TOC Button */
    .btn-drawer-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--gold);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-drawer-toggle:hover {
      background: rgba(212, 175, 55, 0.15);
    }

    /* Sliding Drawer for Table of Contents */
    .toc-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 340px;
      height: 100%;
      background: rgba(12, 16, 22, 0.96);
      backdrop-filter: blur(18px);
      border-left: 1px solid rgba(212, 175, 55, 0.25);
      box-shadow: -15px 0 40px rgba(0, 0, 0, 0.8);
      z-index: 200;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      padding: 28px 24px;
    }

    .toc-drawer.open {
      transform: translateX(0);
    }

    .toc-drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .toc-drawer-title {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: var(--gold);
      letter-spacing: 0.08em;
    }

    .btn-close-drawer {
      background: transparent;
      border: none;
      color: #9ca3af;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .btn-close-drawer:hover {
      color: #ffffff;
    }

    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      flex: 1;
    }

    .toc-item-btn {
      width: 100%;
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 12px 14px;
      color: #cbd5e1;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: all 0.2s;
    }

    .toc-item-btn:hover, .toc-item-btn.active {
      background: rgba(212, 175, 55, 0.12);
      border-color: var(--gold);
      color: #ffffff;
    }

    .toc-item-num {
      font-size: 0.72rem;
      color: var(--gold);
      font-family: 'Cinzel', serif;
      letter-spacing: 0.1em;
    }

    /* Bottom Reading Status Bar */
    .reader-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 28px;
      background: rgba(8, 11, 16, 0.82);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.78rem;
      color: #94a3b8;
      position: sticky;
      bottom: 0;
      z-index: 100;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .reading-progress-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 400px;
    }

    .progress-bar-track {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 12.5%;

              if (tocDrawer) tocDrawer.classList.remove('open');
            });
            tocList.appendChild(li);
          });
        }

        // Update active class on language buttons
        document.querySelectorAll('.btn-book-lang').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
        });
      }

      function renderCurrentPage() {
        const pageData = bookManuscript[currentLang].pages[currentPage];
        if (!pageMount || !pageData) return;

        if (pageData.type === 'cover') {
          pageMount.innerHTML = `
            <article class="story-page active" data-index="0">
              <div class="page-cover">
                <div class="cover-ornament top">✧ ✦ ✧</div>
                <div class="cover-eyebrow">${pageData.eyebrow}</div>
                <h1 class="cover-main-title">${pageData.title}</h1>
                <div class="cover-subtitle">${pageData.subtitle}</div>
                <div class="cover-divider"></div>
                <p class="cover-quote">${pageData.quote}</p>
                <div class="cover-footer">
                  <div class="cover-author">${pageData.author}</div>
                  <div class="cover-era">${pageData.era}</div>
                </div>
                <div class="cover-ornament bottom">✧ ✦ ✧</div>
              </div>
            </article>
          `;
        } else {
          pageMount.innerHTML = `
            <article class="story-page active" data-index="${currentPage}">
              <div class="page-head-strip">
                <span>${pageData.chapter}</span>
                <span>${pageData.part}</span>
              </div>
              <h2 class="story-page-title">${pageData.title}</h2>
              <div class="story-prose">
                ${pageData.paragraphs.join('')}
              </div>
              <div class="page-footer-index">${pageData.footer}</div>
            </article>
          `;
        }

        if (indicator) {
          const tmpl = bookManuscript[currentLang].pageOf;
          indicator.textContent = tmpl.replace('{cur}', currentPage + 1).replace('{tot}', totalPages);
        }

        const pct = Math.round(((currentPage + 1) / totalPages) * 100);
        if (progressFill) progressFill.style.width = `${pct}%`;
        if (progressPercent) progressPercent.textContent = `${pct}%`;

        if (btnPrev) btnPrev.disabled = (currentPage === 0);
        if (btnNext) btnNext.disabled = (currentPage === totalPages - 1);

        // Update active toc button
        document.querySelectorAll('.toc-item-btn').forEach((btn, i) => {
          btn.classList.toggle('active', i === currentPage);
        });
      }

      function goToPage(idx) {
        if (idx < 0 || idx >= totalPages) return;
        currentPage = idx;

        // Subtle 3D page turn reaction
        if (tome) {
          tome.style.transition = 'transform 0.16s ease';
          tome.style.transform = 'scale(0.995)';
          setTimeout(() => {
            tome.style.transform = 'scale(1)';
          }, 160);
        }

        renderCurrentPage();
        window.scrollTo({ top: tome.offsetTop - 80, behavior: 'smooth' });
      }

      // Prev / Next button clicks
      if (btnPrev) btnPrev.addEventListener('click', () => goToPage(currentPage - 1));
      if (btnNext) btnNext.addEventListener('click', () => goToPage(currentPage + 1));

      // Language Switcher clicks
      document.querySelectorAll('.btn-book-lang').forEach(btn => {
        btn.addEventListener('click', () => {
          const lang = btn.getAttribute('data-lang');
          if (lang && (lang === 'pt' || lang === 'en')) {
            currentLang = lang;
            try {
              localStorage.setItem('unnamed_book_lang', lang);
            } catch (e) {}
            updateUILanguage();
            renderCurrentPage();
          }
        });
      });

      // Table of Contents Drawer
      if (btnOpenToc && tocDrawer) {
        btnOpenToc.addEventListener('click', () => tocDrawer.classList.add('open'));
      }
      if (btnCloseToc && tocDrawer) {
        btnCloseToc.addEventListener('click', () => tocDrawer.classList.remove('open'));
      }

      // Zen / Focus Mode
      function toggleZen() {
        document.body.classList.toggle('zen-mode');
      }
      if (btnZenToggle) btnZenToggle.addEventListener('click', toggleZen);
      if (btnExitZen) btnExitZen.addEventListener('click', toggleZen);

      // Themes
      const themeButtons = document.querySelectorAll('.btn-theme');
      themeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const theme = btn.getAttribute('data-theme');
          document.body.classList.remove('theme-fogueira', 'theme-pergaminho', 'theme-noite', 'theme-luz');
          if (theme !== 'fogueira') {
            document.body.classList.add(`theme-${theme}`);
          }
          themeButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });

      // Font Size Scaling
      let currentFontSize = 1.08;
      const btnFontDec = document.getElementById('btnFontDec');
      const btnFontInc = document.getElementById('btnFontInc');

      if (btnFontInc) {
        btnFontInc.addEventListener('click', () => {
          if (currentFontSize < 1.45) {
            currentFontSize += 0.08;
            document.documentElement.style.setProperty('--font-reading-size', `${currentFontSize}rem`);
          }
        });
      }
      if (btnFontDec) {
        btnFontDec.addEventListener('click', () => {
          if (currentFontSize > 0.88) {
            currentFontSize -= 0.08;
            document.documentElement.style.setProperty('--font-reading-size', `${currentFontSize}rem`);
          }
        });
      }

      // Procedural Web Audio (Ambient Soundscapes)
      let audioCtx = null;
      let isAudioPlaying = false;
      let noiseNode = null;
      let filterNode = null;
      let gainNode = null;
      let crackleInterval = null;

      const btnAudioToggle = document.getElementById('btnAudioToggle');
      const audioPresetSelect = document.getElementById('audioPresetSelect');

      function initAudio() {
        if (audioCtx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = noiseBuffer;
        noiseNode.loop = true;

        filterNode = audioCtx.createBiquadFilter();
        gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);

        noiseNode.connect(filterNode);
        filterNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        noiseNode.start();

        updateAudioPreset();
      }

      function updateAudioPreset() {
        if (!filterNode || !gainNode || !audioCtx) return;
        const preset = audioPresetSelect.value;
        const now = audioCtx.currentTime;

        clearInterval(crackleInterval);

        if (preset === 'rain') {
          filterNode.type = 'lowpass';
          filterNode.frequency.setTargetAtTime(950, now, 0.2);
          filterNode.Q.setTargetAtTime(1.2, now, 0.2);
          gainNode.gain.setTargetAtTime(0.08, now, 0.2);
        } else if (preset === 'river') {
          filterNode.type = 'bandpass';
          filterNode.frequency.setTargetAtTime(420, now, 0.2);
          filterNode.Q.setTargetAtTime(0.8, now, 0.2);
          gainNode.gain.setTargetAtTime(0.12, now, 0.2);
        } else if (preset === 'fire') {
          filterNode.type = 'lowpass';
          filterNode.frequency.setTargetAtTime(260, now, 0.2);
          gainNode.gain.setTargetAtTime(0.06, now, 0.2);

          crackleInterval = setInterval(() => {
            if (!isAudioPlaying || !audioCtx) return;
            if (Math.random() > 0.45) {
              const pop = audioCtx.createOscillator();
              const popGain = audioCtx.createGain();
              pop.type = 'triangle';
              pop.frequency.setValueAtTime(300 + Math.random() * 800, audioCtx.currentTime);
              popGain.gain.setValueAtTime(0.04 * Math.random(), audioCtx.currentTime);
              popGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
              pop.connect(popGain);
              popGain.connect(audioCtx.destination);
              pop.start();
              pop.stop(audioCtx.currentTime + 0.05);
            }
          }, 350);
        }
      }

      function toggleAudio() {
        if (!audioCtx) initAudio();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const d = bookManuscript[currentLang];
        if (isAudioPlaying) {
          gainNode.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.15);
          clearInterval(crackleInterval);
          isAudioPlaying = false;
          btnAudioToggle.classList.remove('playing');
          if (audioStateText) audioStateText.textContent = d.audioMute;
        } else {
          isAudioPlaying = true;
          updateAudioPreset();
          btnAudioToggle.classList.add('playing');
          if (audioStateText) audioStateText.textContent = d.audioListening;
        }
      }

      if (btnAudioToggle) btnAudioToggle.addEventListener('click', toggleAudio);
      if (audioPresetSelect) {
        audioPresetSelect.addEventListener('change', () => {
          if (isAudioPlaying) updateAudioPreset();
        });
      }

      // Keyboard navigation
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'PageDown') {
          goToPage(currentPage + 1);
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          goToPage(currentPage - 1);
        } else if (e.key === 'z' || e.key === 'Z') {
          toggleZen();
        } else if (e.key === 'm' || e.key === 'M') {
          toggleAudio();
        } else if (e.key === 'Escape') {
          if (tocDrawer && tocDrawer.classList.contains('open')) {
            tocDrawer.classList.remove('open');
          } else if (document.body.classList.contains('zen-mode')) {
            toggleZen();
          }
        }
      });

      // Mount initial state
      updateUILanguage();
      goToPage(0);
    });
  </script>
</body>
</html>
